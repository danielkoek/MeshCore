name: Build Personal Firmwares

on:
  push:
    branches:
      - AddShedule

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: water_scheduler
            ext: bin
          - target: solenoid_water_scheduler
            ext: zip
          - target: allotment_repeater
            ext: zip
          - target: ble_gateway
            ext: zip
          - target: farnivane_repeater_eth
            ext: bin
      fail-fast: false
    steps:
      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Generate platformio.local.ini
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          PLANTPAL_CHANNEL_PSK: ${{ secrets.PLANTPAL_CHANNEL_PSK }}
        run: |
          envsubst '${ADMIN_PASSWORD} ${PLANTPAL_CHANNEL_PSK}' \
            < platformio.local.ini.template \
            > platformio.local.ini

      - name: Build Firmware
        run: pio run -e ${{ matrix.target }}

      # Rename so each upload has a unique file name (archive: false uses the file name)
      - name: Stage Firmware
        run: cp .pio/build/${{ matrix.target }}/firmware.${{ matrix.ext }} ${{ matrix.target }}.${{ matrix.ext }}

      - name: Upload Firmware
        uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.target }}.${{ matrix.ext }}
          archive: false
          if-no-files-found: error
